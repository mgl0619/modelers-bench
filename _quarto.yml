      - text: "Resources"
        href: resources.qmd
      - text: "About"
        href: about.qmd
    tools:
      - icon: github
        href: "https://github.com/mgl0619/modelers-bench"

  sidebar:
    # ONE ENTRY PER LESSON. The notebooks are deliberately NOT listed here.
    #
    # They are still rendered (project.render globs lessons/**/*.qmd), still
    # executed in CI, and still frozen -- they are simply not navigation. A
    # reader choosing what to study next is choosing a lesson, not a language,
    # and two extra rows per lesson turned the sidebar into a build manifest.
    #
    # Every lesson page links its own notebooks from the "Work through it"
    # slot, which is the moment a reader actually wants them. If you add a
    # lesson with notebooks, put that link in the lesson page -- NOT here --
    # or the notebooks become unreachable. `make check-resources` audits site
    # links and will catch an orphan.
    style: floating
    collapse-level: 2
    contents:
      - text: "Home"
        href: index.qmd
      - text: "Strand P · Pharmacology 101"
        href: pharmacology.qmd
      - section: "P · Pharmacology from the beginning"
