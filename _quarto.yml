            href: lessons/p-01-what-a-drug-is/index.qmd
          - text: "P-02 · Cells and binding"
            href: lessons/p-02-cells-and-binding/index.qmd
          - text: "P-03 · Drug targets"
            href: lessons/p-03-drug-targets/index.qmd
          - text: "P-04 · Binding, quantified"
            href: lessons/p-04-binding-quantified/index.qmd
          - text: "P-05 · Agonists and antagonists"
            href: lessons/p-05-agonists-and-antagonists/index.qmd
      - section: "D · Disease areas"
        contents:
          - text: "D1 · Pancreatic cancer — outline"
            href: diseases.qmd
      - section: "C · Approved drugs"
        contents:
          - text: "C · Clinical pharmacology from FDA reviews — outline"
            href: drugs.qmd
          - text: "C-01 · How to read an FDA review"
            href: lessons/c-01-reading-an-fda-review/index.qmd
          - text: "C-02 · A regimen approved without a trial"
            href: lessons/c-02-a-regimen-without-a-trial/index.qmd
      - section: "S0 · Foundations"
        contents:
          - text: "S0-00 · What quantitative pharmacology is"
            href: lessons/s0-00-what-is-qp/index.qmd
          - text: "S0-01 · Compartments and ODEs"
            href: lessons/s0-01-compartments-and-odes/index.qmd
