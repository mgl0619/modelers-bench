  description: "An open, reproducible curriculum for quantitative pharmacology."
  favicon: assets/favicon.png
  site-url: "https://mgl0619.github.io/modelers-bench"
  repo-url: "https://github.com/mgl0619/modelers-bench"
  repo-actions: [edit, issue]
  page-navigation: true
  back-to-top-navigation: true

  navbar:
    left:
      - text: "Start here"
        href: lessons/s0-00-what-is-qp/index.qmd
      - text: "Pharmacology 101"
        href: pharmacology.qmd
      - text: "Diseases"
        href: diseases.qmd
      - text: "Drugs"
        href: drugs.qmd
      - text: "Paths"
        menu:
          - text: "A · The New Modeler"
            href: paths/path-a-new-modeler.qmd
          - text: "B · The Trainee"
            href: paths/path-b-trainee.qmd
          - text: "C · The Crossover"
            href: paths/path-c-crossover.qmd
      - text: "Cases"
