name: publish

# Renders the site and publishes it to GitHub Pages.
#
# This workflow installs neither R nor a Jupyter kernel for the notebooks,
# because _freeze/ is committed. Notebooks are executed on your machine by
# `make all`, inspected, and the frozen output is what publishes. If a lesson
# renders here differently from how it renders for you, the freeze is stale --
# re-run `make all` and commit _freeze/.
#
# The Configure Pages step below enables Pages automatically, so no manual
# setup is normally needed. If it cannot -- a private repository on GitHub Free,
# where Pages requires Pro or above -- that is where the run fails, early and
# with a readable message, rather than at the deploy step after a full render.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes race. Queue rather than cancel: a push landing
# mid-deploy should still reach the site, not be dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # Fail early and legibly. This workflow renders from frozen notebook
      # output and installs neither R nor a Jupyter kernel, so a notebook
      # missing from _freeze/ cannot be built here.
      #
      # The previous version of this step only checked that _freeze/ was
      # non-empty. That is not the failure that happens. Run #7 failed with a
      # full _freeze/ directory that simply did not include the lesson being
      # added -- generated locally, never git-added. The check now compares
      # every notebook against what git actually tracks.
      #
      # Uses python3 directly rather than make, so it fails in seconds rather
      # than after the dependency install.
      - name: Require committed frozen output for every notebook
        run: python3 scripts/check_freeze.py

      # Turns Pages on if it is not already, and fails fast and legibly if it
      # cannot. Without this step the workflow does all the work first and then
      # dies at the very end in deploy-pages with:
      #
      #   Get Pages site failed. Please verify that the repository has Pages
      #   enabled and configured to build using GitHub Actions
      #
      # which is a confusing way to be told about a settings toggle. `enablement:
      # true` also removes the manual step entirely for a repository where Pages
      # is permitted. Where it is NOT permitted -- a private repository on GitHub
      # Free -- this step is where that surfaces, at the top of the log, before
      # five minutes of rendering.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.42

      # Python is here for the checks, not for the notebooks -- the committed
      # freeze covers those. check_resources.py is stdlib-only, but the case
      # battery needs numpy, pandas and scipy.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Prints which interpreter make chose and why. Deliberately not pinned
      # with PY=python: leaving CI on the same resolution path as a developer's
      # machine means a regression in it is caught here. This step is what makes
      # such a regression legible -- the last one showed up as an opaque
      # "missing: numpy,pandas,scipy,matplotlib" with no clue that make and pip
      # were looking at two different interpreters.
      - name: Report the toolchain make will use
        run: make doctor

      - name: Regenerate the case data and verify it against published truth
        run: make data verify battery

      # Pre-render pass: CSV schema and site links. The rendered-page audit
      # skips here, because _site does not exist yet on a clean checkout.
      - name: Check the resource database and site links
        run: make check-resources

      - name: Render
        run: make render-ci

      # Post-render pass: the same target, now auditing a freshly built page
      # for escaped card markup and lost rows. This is the only point at which
      # that check can fire.
      - name: Audit the rendered page
        run: make check-rendered

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
