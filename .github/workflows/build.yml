name: build

# Manual only. Local `make all` is the primary build — see LOCAL.md.
# Run this from the Actions tab when you want an independent check on a
# clean machine, or before a release.

on:
  workflow_dispatch:
    inputs:
      run_r:
        description: "Also execute the R notebooks (slower — installs R packages)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.42

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Regenerate case data
        run: make data

      - name: Verify the case against its published truth
        run: make verify

      - name: Run the data-check battery
        run: make battery

      - uses: r-lib/actions/setup-r@v2
        if: ${{ inputs.run_r }}
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: ${{ inputs.run_r }}
        with:
          packages: |
            any::deSolve
            any::dplyr
            any::ggplot2
            any::MASS
            any::knitr
            any::rmarkdown

      - name: Render the site
        run: quarto render

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
