name: build

# Manual only. Local `make all` is the primary build — see LOCAL.md.
#
# What this workflow is FOR, now that _freeze/ is committed:
#
#   publish.yml renders from the frozen output, so the site can be wrong in a
#   way nothing notices — if a notebook was edited and the freeze was not
#   refreshed, the published page shows output that no longer matches its own
#   code. This workflow is the check against that. It renders with --execute,
#   which ignores the freeze and runs every cell from source on a clean
#   machine. If it succeeds and the pages look right, the freeze is honest.
#
# Run it from the Actions tab before a release, or after any change to a
# notebook where you are unsure the freeze was updated.

on:
  workflow_dispatch:
    inputs:
      run_r:
        description: "Also execute the R notebooks (slower — installs R packages)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.42

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Prints which interpreter make chose and why. Deliberately not pinned
      # with PY=python: leaving CI on the same resolution path as a developer's
      # machine means a regression in it is caught here. This step is what makes
      # such a regression legible -- the last one showed up as an opaque
      # "missing: numpy,pandas,scipy,matplotlib" with no clue that make and pip
      # were looking at two different interpreters.
      - name: Report the toolchain make will use
        run: make doctor

      - name: Regenerate case data
        run: make data

      - name: Verify the case against its published truth
        run: make verify

      - name: Run the data-check battery
        run: make battery

      - name: Check the resource database and site links
        run: make check-resources

      - uses: r-lib/actions/setup-r@v2
        if: ${{ inputs.run_r }}
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: ${{ inputs.run_r }}
        with:
          packages: |
            any::deSolve
            any::dplyr
            any::ggplot2
            any::MASS
            any::knitr
            any::rmarkdown

      # --execute overrides `freeze: auto` and re-runs every cell, which is the
      # entire point of this workflow.
      #
      # The run_r=false branch uses the `nor` profile. Previously this step ran
      # a plain `quarto render` regardless, so unchecking the box did not skip
      # the R notebooks — it removed R and then failed at the first one.
      - name: Render, executing every cell from source
        run: |
          if [ "${{ inputs.run_r }}" = "true" ]; then
            quarto render --execute
          else
            echo "run_r=false — skipping the R notebooks via the 'nor' profile."
            echo "Their sidebar links will 404 in this build. That is expected."
            QUARTO_PROFILE=nor quarto render --execute
          fi

      - name: Audit the rendered page
        run: make check-rendered

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
